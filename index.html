<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مصنع الأحلام المقلوبة - Upside-Down Dream Factory</title>
    <!-- استيراد خط عربي مبهج للأطفال -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1c4b, #43114d, #7b1fa2);
            font-family: 'Cairo', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding-bottom: 20px;
        }
        header {
            text-align: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            width: 100%;
            border-bottom: 4px dashed #ffeb3b;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #ffeb3b;
            text-shadow: 2px 2px #e91e63;
        }
        .stats {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 4px;
            font-size: 1rem;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 480px;
            padding: 15px;
            text-align: center;
        }
        .order-box {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #00bcd4;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 15px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .order-title {
            font-size: 1rem;
            color: #00bcd4;
            margin-bottom: 6px;
        }
        .target-recipe {
            font-size: 1.2rem;
            font-weight: 900;
            background: #ff4081;
            padding: 8px 12px;
            border-radius: 10px;
            display: inline-block;
            word-break: break-word;
        }
        .assembly-line {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
            width: 100%;
        }
        .slot {
            width: 80px;
            height: 80px;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            background: rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
        }
        .slot.filled {
            border-style: solid;
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.3);
            transform: scale(1.05);
        }
        .parts-pool {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 10px;
            border-radius: 16px;
            width: 100%;
            margin-top: 10px;
        }
        .part-item {
            width: 65px;
            height: 65px;
            background: #ff9800;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.1s, background 0.2s;
        }
        .part-item:active {
            transform: scale(0.9);
            background: #ff5722;
        }
        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.5);
            margin-top: 15px;
            width: 100%;
            max-width: 300px;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .message {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
            min-height: 30px;
            color: #ffeb3b;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏭 مصنع الأحلام المقلوبة</h1>
        <div class="stats">
            <span>✨ الأحلام المصنوعة: <span id="score">0</span></span>
        </div>
    </header>

    <div class="container">
        <!-- طلب الحلم -->
        <div class="order-box">
            <div class="order-title">طلب حلم جديد من طفل نائم:</div>
            <div class="target-recipe" id="targetRecipeText">جاري جلب الحلم...</div>
        </div>

        <!-- خط التركيب -->
        <div class="assembly-line" id="assemblyLine">
            <div class="slot" data-index="0">❓</div>
            <div class="slot" data-index="1">❓</div>
            <div class="slot" data-index="2">❓</div>
        </div>

        <div class="message" id="message">اضغط على القطع المناسبة لتركيب الحلم!</div>

        <!-- زر تسليم الحلم -->
        <button class="btn" id="deliverBtn" onclick="checkDream()">✨ إرسال الحلم للنائم!</button>

        <!-- قطع الألعاب المتاحة للدمج -->
        <div class="parts-pool" id="partsPool"></div>
    </div>

    <script>
        // نظام الصوت المدمج عبر المتصفح (Web Audio API) لتجنب مشاكل الملفات الخارجية
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // تشغيل نغمة نقر خفيفة عند اختيار قطعة
        function playClickSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // تشغيل معزوفة نجاح تشجيعية (ألحان بهيجة) عند نجاح الحلم
        function playSuccessSound() {
            initAudio();
            if (!audioCtx) return;
            let notes = [523.25, 659.25, 783.99, 1046.50]; // نغمات Do, Mi, Sol, High Do
            notes.forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime + index * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.12 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + index * 0.12);
                osc.stop(audioCtx.currentTime + index * 0.12 + 0.3);
            });
        }

        // تشغيل صوت تنبيه خطأ لطيف
        function playErrorSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // قائمة الأحلام
        const dreamsList = [
            { name: "قطة تطير بأجنحة شوكولاتة", needed: ["🐱", "🍫", "🪽"] },
            { name: "سيارة تسير على غيوم وردية", needed: ["🚗", "☁️", "🍬"] },
            { name: "سلحفاة صاروخية بالفضاء", needed: ["🐢", "🚀", "🌌"] },
            { name: "شجرة تفاح تمطر نجوم", needed: ["🌳", "🍎", "⭐"] },
            { name: "سمكة طائرة تلبس نظارة", needed: ["🐟", "🛩️", "👓"] }
        ];

        let currentDreamIndex = 0;
        let currentRecipe = dreamsList[currentDreamIndex];
        let playerSlots = [null, null, null];
        let score = 0;

        const targetRecipeText = document.getElementById("targetRecipeText");
        const assemblyLine = document.getElementById("assemblyLine");
        const partsPool = document.getElementById("partsPool");
        const message = document.getElementById("message");
        const scoreDisplay = document.getElementById("score");

        function initGame() {
            targetRecipeText.innerText = (currentDreamIndex + 1) + ". " + currentRecipe.name;
            playerSlots = [null, null, null];
            renderSlots();
            renderPool();
            message.innerText = "اختر القطع الغريبة بالترتيب المناسب!";
        }

        function renderSlots() {
            const slotsHtml = playerSlots.map((part, index) => {
                return `<div class="slot ${part ? 'filled' : ''}" onclick="removePart(${index})">${part ? part : '❓'}</div>`;
            }).join('');
            assemblyLine.innerHTML = slotsHtml;
        }

        function renderPool() {
            let poolParts = [...currentRecipe.needed, "🎈", "🎩", "🧸"];
            poolParts.sort(() => Math.random() - 0.5);

            const poolHtml = poolParts.map(part => {
                return `<div class="part-item" onclick="addPart('${part}')">${part}</div>`;
            }).join('');
            partsPool.innerHTML = poolHtml;
        }

        function addPart(part) {
            playClickSound();
            const emptyIndex = playerSlots.indexOf(null);
            if (emptyIndex !== -1) {
                playerSlots[emptyIndex] = part;
                renderSlots();
            }
        }

        function removePart(index) {
            if (playerSlots[index] !== null) {
                playClickSound();
                playerSlots[index] = null;
                renderSlots();
            }
        }

        function checkDream() {
            if (playerSlots.includes(null)) {
                playErrorSound();
                message.innerText = "⚠️ مصنع الأحلام ناقص! املأ كل الخانات أولاً.";
                return;
            }

            let isMatch = true;
            for (let i = 0; i < 3; i++) {
                if (playerSlots[i] !== currentRecipe.needed[i]) {
                    isMatch = false;
                    break;
                }
            }

            if (isMatch) {
                score++;
                scoreDisplay.innerText = score;
                playSuccessSound();
                message.innerText = "🎉 رائع جداً! نام الطفل بسعادة وحلم حلمك العجيب!";
                
                setTimeout(() => {
                    currentDreamIndex = (currentDreamIndex + 1) % dreamsList.length;
                    currentRecipe = dreamsList[currentDreamIndex];
                    initGame();
                }, 2200);
            } else {
                playErrorSound();
                message.innerText = "❌ أوه! خلطة غير متناسقة، جرب ترتيبها بشكل مقلوب أكثر!";
            }
        }

        initGame();
    </script>
</body>
</html>
